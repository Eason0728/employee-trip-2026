<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鼎鼎好聲音・主持人控制台</title>
<style>
:root{
  color-scheme: dark;
  --bg:#12100E; --card:#1B1815; --card2:#231F1A;
  --line:#332C25; --text:#F2ECE2; --dim:#B4A796; --faint:#7E7365;
  --gold:#E8C468; --ember:#FF8A3D; --ok:#57AC81; --bad:#E4574A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"PingFang TC","Heiti TC",system-ui,sans-serif;font-size:16px;line-height:1.6;
     padding:0 16px 60px;max-width:720px;margin:0 auto}
h1{font-size:21px;margin:22px 0 4px}
.sub{color:var(--faint);font-size:13px;margin:0 0 18px}
h2{font-size:14px;color:var(--dim);letter-spacing:.08em;margin:0 0 12px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:14px}
button{font-family:inherit;font-size:16px;border-radius:9px;border:1px solid var(--line);
       background:var(--card2);color:var(--text);padding:12px 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.primary{background:var(--ember);border-color:var(--ember);color:#1B1008;font-weight:700}
.danger{border-color:rgba(228,87,74,.5);color:#F0AAA3}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);
      font-size:17px;padding:11px 12px;font-family:ui-monospace,monospace;width:100%}
input:focus{outline:2px solid var(--ember);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:0 0 auto}
.grow{flex:1 1 120px;min-width:0}

.now{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.now .big{font-size:52px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.now .cap{font-size:13px;color:var(--faint)}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.pill.live{border-color:rgba(87,172,129,.5);color:#A8DCC2}
.pill.stop{border-color:rgba(228,87,74,.5);color:#F0AAA3}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--faint);letter-spacing:.08em;font-weight:400}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
tr.top td{color:var(--gold);font-weight:600}

.msg{border-radius:9px;padding:12px 14px;font-size:15px;margin-bottom:14px;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(87,172,129,.12);border:1px solid rgba(87,172,129,.4);color:#A8DCC2}
.msg.bad{background:rgba(228,87,74,.12);border:1px solid rgba(228,87,74,.4);color:#F0AAA3}
.hint{font-size:12.5px;color:var(--faint);line-height:1.55}

@media print{
  :root{--bg:#fff;--card:#fff;--card2:#fff;--line:#999;--text:#000;--dim:#333;--faint:#555}
  html,body{background:#fff;color:#000}
  .noprint{display:none !important}
}
</style>
</head>
<body>

<h1>鼎鼎好聲音・控制台</h1>
<div id="demoBar" style="display:none;background:#3A2A12;border:1px solid #7A5A1E;color:#F0D9A0;
  border-radius:9px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin:14px 0 0">
  <b>示範模式</b>　後端網址還沒填，資料只存在這台電腦的瀏覽器裡。
  下面的通行碼輸入 <b style="font-family:ui-monospace,monospace">demo</b>。
</div>

<p class="sub noprint">只有主持人開這一頁。同仁開的是 vote.html。</p>

<div id="msg" class="msg noprint"></div>

<section class="card noprint" id="login">
  <h2>通行碼</h2>
  <div class="row">
    <input type="password" id="pw" class="grow" placeholder="控制台通行碼" autocomplete="off">
    <button class="primary" id="go">進入</button>
  </div>
</section>

<div id="panel" hidden>

  <section class="card noprint">
    <h2>現在開放評分到</h2>
    <div class="now">
      <span class="big" id="openTo">0</span>
      <span class="cap">／ 共 <b id="total">0</b> 組</span>
      <span class="pill" id="status">—</span>
    </div>
    <div class="row">
      <button class="primary" id="next">開放下一組 ▸</button>
      <button id="prev">退回上一組</button>
      <button class="danger" id="close">結束評分</button>
    </div>
    <p class="hint" style="margin-top:12px">
      每組唱完就按一次「開放下一組」。還沒開放的組別，同仁的手機按不下去，
      就算硬送伺服器也會擋掉。
    </p>
  </section>

  <section class="card noprint">
    <h2>設定</h2>
    <div class="row">
      <input type="number" id="setTotal" class="grow" min="0" max="99" placeholder="參賽組數">
      <button id="saveTotal">存組數</button>
      <button id="round1">切初賽</button>
      <button id="round2">切決賽</button>
    </div>
    <p class="hint" style="margin-top:12px">
      切決賽時記得把組數改成 5，並按「重置分數」把初賽的票清掉
      （初賽成績自己抄下來，清了就沒了）。
    </p>
    <div class="row" style="margin-top:12px">
      <button class="danger" id="reset">重置分數</button>
    </div>
  </section>

  <section class="card">
    <h2 class="noprint">即時排名　<span id="devs" style="color:var(--faint)"></span></h2>
    <div id="rank"><p class="hint">還沒有分數。</p></div>
    <p class="hint noprint" style="margin-top:10px">收到的票全部計入。每 5 秒自動更新。</p>
  </section>


</div>

<script src="vote-demo.js"></script>
<script>
(function(){
'use strict';

var API = window.VOTE_API || 'PASTE_APPS_SCRIPT_URL_HERE';  // window.VOTE_API 只給回測覆寫用
var DEMO = (API === 'PASTE_APPS_SCRIPT_URL_HERE') && !!window.VOTE_DEMO;
if (DEMO) { var _db = document.getElementById('demoBar'); if (_db) _db.style.display = 'block'; }
var pw = '', timer = null;

var seq = 0;
function call(params, cb){
  if (DEMO) { var r = window.VOTE_DEMO(params); setTimeout(function(){ cb(r); }, 140); return; }
  var name = '__acb' + (++seq), done = false;
  var s = document.createElement('script');
  var t = setTimeout(function(){ finish({ok:false, err:'timeout'}); }, 15000);
  function finish(res){
    if (done) return; done = true;
    clearTimeout(t);
    try { delete window[name]; } catch(e){ window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    cb(res);
  }
  window[name] = function(res){ finish(res); };
  s.onerror = function(){ finish({ok:false, err:'network'}); };
  var q = ['callback=' + name];
  for (var k in params) if (params.hasOwnProperty(k)) {
    q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }
  s.src = API + '?' + q.join('&');
  document.head.appendChild(s);
}

var msgEl = document.getElementById('msg'), msgTimer;
function say(t, kind){
  clearTimeout(msgTimer);
  msgEl.textContent = t;
  msgEl.className = 'msg show ' + (kind || 'ok');
  if (kind !== 'bad') msgTimer = setTimeout(function(){ msgEl.className = 'msg noprint'; }, 3500);
}

var state = {total:0, openTo:0, round:1, closed:false};

function admin(params, cb){
  params.action = 'admin'; params.pw = pw;
  call(params, function(res){
    if (res && res.ok) render(res);
    else say(res && res.err === 'badpw' ? '通行碼不對。' : '連不上伺服器，再按一次。', 'bad');
    if (cb) cb(res);
  });
}

function render(res){
  state.total  = res.total  || 0;
  state.openTo = res.openTo || 0;
  state.round  = res.round  || 1;
  state.closed = !!res.closed;

  document.getElementById('openTo').textContent = state.openTo;
  document.getElementById('total').textContent  = state.total;
  var st = document.getElementById('status');
  st.textContent = state.closed ? '已結束' : (state.round === 2 ? '決賽進行中' : '初賽進行中');
  st.className = 'pill ' + (state.closed ? 'stop' : 'live');
  if (document.activeElement !== document.getElementById('setTotal')){
    document.getElementById('setTotal').value = state.total;
  }

  var rows = res.rows || [], rk = document.getElementById('rank');
  if (!rows.length){ rk.innerHTML = '<p class="hint">還沒有分數。</p>'; }
  else {
    var h = '<table><thead><tr><th>名次</th><th>組別</th><th class="n">票數</th>'
          + '<th class="n">採計</th><th class="n">平均</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      h += '<tr' + (i < 3 ? ' class="top"' : '') + '><td>' + (i+1) + '</td><td>' + r.g
         + '號</td><td class="n">' + r.n
         + '</td><td class="n">' + r.avg.toFixed(2) + '</td></tr>';
    }
    rk.innerHTML = h + '</tbody></table>';
  }

  var dv = document.getElementById('devs');
  if (dv) dv.textContent = (res.devices || 0) + ' 支手機投過';
}

document.getElementById('go').addEventListener('click', function(){
  pw = document.getElementById('pw').value;
  if (!pw) return;
  admin({op:'get'}, function(res){
    if (res && res.ok){
      document.getElementById('login').hidden = true;
      document.getElementById('panel').hidden = false;
      timer = setInterval(function(){ admin({op:'get'}); }, 5000);
    }
  });
});
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('go').click();
});

document.getElementById('next').addEventListener('click', function(){
  if (state.openTo >= state.total){ say('已經開放到最後一組了。', 'bad'); return; }
  admin({op:'set', openTo: state.openTo + 1});
});
document.getElementById('prev').addEventListener('click', function(){
  if (state.openTo <= 0) return;
  admin({op:'set', openTo: state.openTo - 1});
});
document.getElementById('close').addEventListener('click', function(){
  if (!confirm('結束評分？之後同仁就送不出分數了。')) return;
  admin({op:'set', closed: state.closed ? 0 : 1});
});
document.getElementById('saveTotal').addEventListener('click', function(){
  admin({op:'set', total: document.getElementById('setTotal').value}, function(){ say('組數已存。'); });
});
document.getElementById('round1').addEventListener('click', function(){ admin({op:'set', round:1}); });
document.getElementById('round2').addEventListener('click', function(){ admin({op:'set', round:2}); });
document.getElementById('reset').addEventListener('click', function(){
  if (!confirm('把所有分數清掉？初賽成績記得先抄下來。')) return;
  admin({op:'reset'}, function(){ say('分數已清空。'); });
});
})();
</script>
</body>
</html>
