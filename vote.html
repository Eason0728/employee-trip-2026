<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鼎鼎好聲音</title>
<meta name="description" content="填名字和想唱的歌就完成報名。唱完之後大家用手機打分數，主持人公佈才看得到名次。">
<meta property="og:title" content="鼎鼎好聲音｜報名與評分">
<meta property="og:description" content="填名字和想唱的歌就完成報名。唱完之後大家用手機打分數，主持人公佈才看得到名次。">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;
  --card:#ffffff;
  --card2:#ffffff;
  --line:#E5E5E5;
  --text:#3C3C3C;
  --dim:#777777;
  --faint:#AFAFAF;
  --accent:#58CC02;
  --on-accent:#ffffff;
  --accent2:#DDF4FF;
  --on-accent2:#1899D6;
  --tabbar:#F7F7F7;
  --tab-bg:#58CC02;
  --tab-fg:#ffffff;
  --tab-sh:0 3px 0 #3C8A02;
  --bd-w:2px;
  --btn-sh:0 4px 0 #3C8A02;
  --btn-sh2:0 2px 0 #E5E5E5;
  --pick-sh:0 2px 0 #84D8FF;
  --tap-y:2px;
  --sel-bd:#84D8FF;
  --num:#1CB0F6;
  --dis-bg:#E5E5E5;
  --dis-fg:#AFAFAF;
  --dis-sh:0 4px 0 #C0C0C0;
  --ok:#58CC02;
  --bad:#FF4B4B;
  --r-card:16px;
  --r-btn:14px;
  --r-tab:12px;
  --r-in:14px;
  --btn-w:800;
  --btn-ls:.6px;
  --btn-tt:uppercase;
  --h1-w:800;
  --h1-ls:-.01em;
  --h1-c:#58CC02;
  --h1-sh:none;
  --msg-ok:#D7FFB8;
  --msg-ok-b:#58CC02;
  --msg-ok-f:#417B02;
  --msg-bad:#FFDFE0;
  --msg-bad-b:#FF4B4B;
  --msg-bad-f:#EA2B2B;
  --msg-wa:#FFF4D9;
  --msg-wa-b:#FFC800;
  --msg-wa-f:#8A6800;
  --rank1:#FFF9E0;
  --shadow:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,"PingFang TC","Heiti TC",system-ui,sans-serif;
  font-size:17px;line-height:1.6;
  padding:0 16px 48px;max-width:520px;margin:0 auto;
  -webkit-font-smoothing:antialiased;
}
/* 標題列：左邊三個品牌 logo（同時是主持人入口），右邊標題 */
.head{display:flex;align-items:center;gap:11px;margin:20px 0 18px}
.brand{display:flex;align-items:center;gap:4px;flex:none;
  text-decoration:none;padding:3px;margin:-3px;border-radius:10px}
/* 三個 logo 底色不同（紅／青／白），白底那張在白頁上沒有邊界，補一圈極淡的框才一致 */
.brand img{height:36px;width:auto;display:block;border-radius:8px;
  box-shadow:0 0 0 1px rgba(0,0,0,.07)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.title{min-width:0}
.head h1{margin:0}
.head .sub{margin:2px 0 0}
/* 麥克風跟著標題走：吃 currentColor，換主題不用另外改 */
.mic{width:.95em;height:.95em;margin-left:.28em;vertical-align:-.09em;
  fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;margin:22px 0 4px;font-weight:var(--h1-w);
   letter-spacing:var(--h1-ls);color:var(--h1-c);text-shadow:var(--h1-sh)}
.sub{color:var(--faint);font-size:13.5px;margin:0 0 18px}
.card{background:var(--card);border:var(--bd-w) solid var(--line);border-radius:var(--r-card);
  padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--dim);letter-spacing:.06em;margin-bottom:10px}
.hint{font-size:13.5px;color:var(--faint);margin:8px 0 0}
button{font-family:inherit;font-size:17px;border-radius:var(--r-btn);
  border:var(--bd-w) solid var(--line);box-shadow:var(--btn-sh2);
  background:var(--card2);color:var(--text);padding:13px 16px;cursor:pointer}
button:active{transform:translateY(var(--tap-y))}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  font-weight:var(--btn-w);letter-spacing:var(--btn-ls);text-transform:var(--btn-tt);
  box-shadow:var(--btn-sh);width:100%;padding:16px;font-size:18px}
.primary:disabled{background:var(--dis-bg);border-color:var(--dis-bg);color:var(--dis-fg);
  box-shadow:var(--dis-sh);font-weight:var(--btn-w);letter-spacing:normal}
.ghost{background:transparent;color:var(--dim);width:100%}
input{font-family:inherit;font-size:17px;width:100%;padding:13px 14px;border-radius:var(--r-in);
  border:var(--bd-w) solid var(--line);background:var(--card2);color:var(--text)}
input::placeholder{color:var(--faint)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* 分頁 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px;
  background:var(--tabbar);border:1px solid var(--line);border-radius:var(--r-tab);padding:5px}
.tabs button{border:none;background:transparent;color:var(--dim);padding:11px 4px;
  font-size:15.5px;border-radius:calc(var(--r-tab) - 3px)}
.tabs button[aria-selected=true]{background:var(--tab-bg);color:var(--tab-fg);
  font-weight:700;box-shadow:var(--tab-sh)}

/* 訊息條 */
.msg{border-radius:var(--r-btn);padding:12px 14px;margin:0 0 14px;font-size:15px;display:none}
.msg.show{display:block}
.msg.ok{background:var(--msg-ok);border:1px solid var(--msg-ok-b);color:var(--msg-ok-f)}
.msg.bad{background:var(--msg-bad);border:1px solid var(--msg-bad-b);color:var(--msg-bad-f)}
.msg.wait{background:var(--msg-wa);border:1px solid var(--msg-wa-b);color:var(--msg-wa-f)}

/* 報名的歌曲欄：一首歌一塊，歌名與歌手分開填 */
.songs{display:flex;flex-direction:column;gap:11px}
.song-row{background:var(--card2);border:var(--bd-w) solid var(--line);border-radius:var(--r-in);padding:11px 12px}
.song-row .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.song-row .head span{color:var(--faint);font-size:13px;letter-spacing:.05em}
.song-row .head button{padding:5px 10px;font-size:13px;color:var(--dim);
  background:transparent;border-color:transparent;box-shadow:none}
.song-row .pair{display:flex;flex-direction:column;gap:7px}
.song-row input{background:var(--card);font-size:16px;padding:11px 12px}

/* 參賽者卡片 */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;
  border-radius:var(--r-card)}
.person .no{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:3.1em;flex:none;line-height:1.15}
.person .no b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--num)}
.person .no i{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.04em}
.person .who{flex:1;min-width:0}
.person .who b{font-size:17px;font-weight:600;display:block}
.person .who i{font-style:normal;font-size:13px;color:var(--faint);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .got{font-size:13px;color:var(--ok);font-weight:600;flex:none}
.person[aria-pressed=true]{background:var(--accent2);border-color:var(--sel-bd);
  color:var(--on-accent2);box-shadow:var(--pick-sh)}
.person[aria-pressed=true] .no b,
.person[aria-pressed=true] .no i,
.person[aria-pressed=true] .who i{color:var(--on-accent2)}
.person.done{border-style:dashed}

/* 評分列 */
.crit{margin-bottom:20px}
.crit:last-of-type{margin-bottom:8px}
.crit h3{font-size:16px;margin:0 0 2px}
.crit p{font-size:13px;color:var(--faint);margin:0 0 10px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{padding:15px 0;font-size:19px;font-variant-numeric:tabular-nums}
.scale button[aria-pressed=true]{background:var(--accent2);border-color:var(--sel-bd);
  color:var(--on-accent2);font-weight:700;box-shadow:var(--pick-sh)}

/* 唯讀分數 */
.recap{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:var(--r-card);overflow:hidden}
.recap div{display:flex;justify-content:space-between;align-items:baseline;background:var(--card2);padding:12px 14px}
.recap span{color:var(--dim);font-size:15px}
.recap b{font-size:20px;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}

/* 成績 */
.rank{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:var(--r-card);overflow:hidden}
.rank .row{display:flex;align-items:center;gap:12px;background:var(--card2);padding:13px 14px}
.rank .row:nth-child(1){background:var(--rank1)}
.rank .pos{font-size:17px;font-weight:700;color:var(--num);min-width:1.6em;flex:none;
  font-variant-numeric:tabular-nums}
.rank .who{flex:1;min-width:0}
.rank .who b{display:block;font-size:16.5px;font-weight:600}
.rank .who i{font-style:normal;font-size:12.5px;color:var(--faint)}
.rank .avg{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,monospace;flex:none}

  border-radius:var(--r-card);padding:11px 13px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>

<div class="head">
  <!-- 三個品牌 logo 同時是主持人入口。看起來只是裝飾，同仁不會想點；
       就算誤點也只會看到通行碼那一關，進不去。 -->
  <a class="brand" href="vote-admin.html" aria-label="主持人控制台">
    <img src="logos/mala.png" alt="麻的小辛辣" width="36" height="36">
    <img src="logos/mzt.png"  alt="墨竹亭"     width="38" height="36">
    <img src="logos/yiwu.png" alt="一悟燒肉"   width="36" height="36">
  </a>
  <div class="title">
    <h1>鼎鼎好聲音<svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3"/>
      <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8" y1="22" x2="16" y2="22"/>
    </svg></h1>
    <p class="sub">2026 鼎兆元員工旅遊　9/14 晚間</p>
  </div>
</div>

<div class="tabs" role="tablist">
  <button role="tab" id="tabSignup" aria-selected="true"  onclick="go('signup')">報名</button>
  <button role="tab" id="tabVote"   aria-selected="false" onclick="go('vote')">評分</button>
  <button role="tab" id="tabResult" aria-selected="false" onclick="go('result')">成績</button>
</div>

<div id="msg" class="msg"></div>

<!-- ══════════ 報名 ══════════ -->
<div id="pageSignup">
  <section class="card" id="signupForm">
    <div class="label">你的名字</div>
    <input id="name" maxlength="20" placeholder="王小明" autocomplete="name">
    <div class="label" style="margin-top:18px">想唱的歌　<span style="color:var(--faint)">至少兩首，歌名和歌手都要填</span></div>
    <div class="songs" id="songs"></div>
    <button class="ghost" style="margin-top:9px" onclick="addSong()">＋ 再加一首</button>
    <p class="hint">填兩首以上是怕現場設備沒有這首歌，當天唱哪一首你自己決定。</p>
    <button class="primary" style="margin-top:16px" id="signupBtn" onclick="submitSignup()">送出報名</button>
  </section>

  <section class="card" id="signupDone" hidden>
    <div class="label">你報名好了</div>
    <div class="recap">
      <div><span>編號</span><b id="myNo">—</b></div>
      <div><span>姓名</span><b id="myName" style="font-size:17px">—</b></div>
    </div>
    <div class="label" style="margin-top:16px">你的歌單</div>
    <div id="mySongs" class="hint" style="color:var(--text);font-size:15px"></div>
    <p class="hint">要改歌或退出，直接跟主持人說。</p>
  </section>

  <section class="card">
    <div class="label">已經報名的人</div>
    <div id="signupList" class="hint">按下面重新整理</div>
    <button class="ghost" style="margin-top:12px" onclick="loadList(true, this)">重新整理名單</button>
  </section>
</div>

<!-- ══════════ 評分 ══════════ -->
<div id="pageVote" hidden>
  <section class="card">
    <div class="label">要評誰</div>
    <div class="people" id="people"><p class="hint" style="margin:0">讀取中…</p></div>
    <button class="ghost" style="margin-top:12px" onclick="loadList(true, this)">重新整理名單</button>
  </section>

  <section class="card" id="voteForm" hidden>
    <div class="label">給 <b id="vTarget" style="color:var(--gold)">—</b> 打分數</div>
    <div id="crits"></div>
    <button class="primary" id="sendVote" disabled onclick="submitVote()">送出評分</button>
    <p class="hint">送出後不能改，同一個人只能評一次。</p>
  </section>

  <section class="card" id="voteDone" hidden>
    <div class="label">你給 <b id="rTarget" style="color:var(--gold)">—</b> 的分數</div>
    <div class="recap" id="recap"></div>
    <button class="ghost" style="margin-top:14px" onclick="clearPick()">評下一位</button>
  </section>
</div>

<!-- ══════════ 成績 ══════════ -->
<div id="pageResult" hidden>
  <section class="card">
    <div class="label">目前排名</div>
    <div id="rank" class="hint">按下面查詢</div>
    <button class="ghost" style="margin-top:14px" onclick="loadRank(this)">查詢成績</button>
    <p class="hint" id="rankNote"></p>
  </section>
</div>

<script src="vote-demo.js"></script>
<script>
/* ══════════ 設定 ══════════ */
var UNSET = 'PASTE_APPS_SCRIPT_URL_HERE';          // 「還沒接後端」的標記，換網址時別動它
var API   = window.VOTE_API || 'https://script.google.com/macros/s/AKfycbwQMUeaML-qtuQc_AtV210iYGzYIdLkIpEZ9btW3l1DGUMtJvjR5NRMpzA0GYPchSxalA/exec';   // ← 換後端只改這一行；window.VOTE_API 只給回測覆寫
var DEMO  = (API === UNSET) && !!window.VOTE_DEMO;

var CRITERIA = ['唱功', '感情', '炒熱度'];
var CRIT_HINT = { '唱功': '音準、穩不穩', '感情': '有沒有唱進去', '炒熱度': '底下有沒有跟著動' };
var MIN_SONGS = 2;

/* ══════════ 裝置編號：一支手機一個，存在自己的瀏覽器 ══════════ */
var DEV_KEY = 'ddgs-dev';
var dev = localStorage.getItem(DEV_KEY);
if (!dev) {
  dev = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  try { localStorage.setItem(DEV_KEY, dev); } catch (e) {}
}

/* 本機記著自己報名了誰、評過誰——省一次往返，也讓離線時畫面不會空白 */
var MINE_KEY = 'ddgs-mine', VOTED_KEY = 'ddgs-voted';
function readJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var mine  = readJSON(MINE_KEY, null);      // { no, name, songs }
var voted = readJSON(VOTED_KEY, {});       // { 編號: [s1,s2,s3] }

/* ══════════ JSONP ══════════ */
var seq = 0;
function call(params, done, fail) {
  if (DEMO) { window.VOTE_DEMO(params, done, fail); return; }
  var cb = 'cb' + (++seq) + '_' + Date.now().toString(36);
  // 2026-09-10 對正式後端做 60 併發壓測：成功的請求裡有 12 筆超過 30 秒、最慢 92 秒。
  // 逾時設太短會把「其實已經寫進去」的請求判成失敗，同仁一直重按反而更塞。
  // 重按本身是安全的——計分時每支手機對同一個人只取第一筆。
  var timer = setTimeout(function () { cleanup(); fail && fail('timeout'); }, 60000);
  function cleanup() {
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  window[cb] = function (res) { cleanup(); done(res); };
  var qs = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  var s = document.createElement('script');
  s.src = API + '?' + qs + '&callback=' + cb;
  s.onerror = function () { cleanup(); fail && fail('network'); };
  document.body.appendChild(s);
}

/* ══════════ 畫面共用 ══════════ */
var msgEl = document.getElementById('msg');
var msgTimer = null;
function say(text, kind, sticky) {
  clearTimeout(msgTimer);
  msgEl.textContent = text;
  msgEl.className = 'msg show ' + (kind || 'wait');
  if (!sticky) msgTimer = setTimeout(function () { msgEl.className = 'msg'; }, 4200);
}
function hush() { clearTimeout(msgTimer); msgEl.className = 'msg'; }

var ERR = {
  signupClosed: '報名已經關閉了，找主持人。',
  voteClosed  : '主持人還沒開放評分，等一下再試。',
  dupname     : '這個名字已經報過了。如果剛才你按過送出，那多半就是你自己——按下面「重新整理名單」確認。真的同名就加個綽號。',
  fewsongs    : '至少要填兩首完整的歌（歌名＋歌手）。',
  noname      : '要填名字。',
  badno       : '找不到這位參賽者，重新整理名單試試。',
  badscore    : '三項都要打分數。',
  busy        : '大家同時在送，等個五秒再按一次就好。',
  timeout     : '等太久了。可能其實已經送出去——按下面「重新整理名單」看有沒有你，沒有再按一次。',
  network     : '連不上，檢查網路後再試一次。',
  server      : '伺服器出錯了，跟主持人說一聲。'
};
function errText(e) { return ERR[e] || ('出了點問題（' + e + '）'); }

function go(page) {
  ['signup', 'vote', 'result'].forEach(function (p) {
    document.getElementById('page' + p[0].toUpperCase() + p.slice(1)).hidden = (p !== page);
    document.getElementById('tab' + p[0].toUpperCase() + p.slice(1))
      .setAttribute('aria-selected', String(p === page));
  });
  hush();
  if (page === 'vote') loadList();
  if (page === 'result') loadRank();
  try { history.replaceState(null, '', '#' + page); } catch (e) {}
}

/* ══════════ 報名 ══════════ */
var songBox = document.getElementById('songs');
function addSong(title, artist) {
  var i = songBox.children.length + 1;
  var row = document.createElement('div');
  row.className = 'song-row';
  row.innerHTML =
      '<div class="head"><span>第 ' + i + ' 首</span>'
    + '<button type="button" aria-label="刪掉這首">刪掉</button></div>'
    + '<div class="pair">'
    + '<input class="t" maxlength="60" placeholder="歌名">'
    + '<input class="a" maxlength="40" placeholder="歌手">'
    + '</div>';
  row.querySelector('.t').value = title || '';
  row.querySelector('.a').value = artist || '';
  row.querySelector('button').onclick = function () {
    if (songBox.children.length <= MIN_SONGS) { say('至少要留兩首。', 'wait'); return; }
    row.remove(); renumber();
  };
  songBox.appendChild(row);
}
function renumber() {
  [].forEach.call(songBox.children, function (r, i) {
    r.querySelector('.head span').textContent = '第 ' + (i + 1) + ' 首';
  });
}
for (var i = 0; i < MIN_SONGS; i++) addSong();

function showMine() {
  if (!mine) return;
  document.getElementById('signupForm').hidden = true;
  document.getElementById('signupDone').hidden = false;
  document.getElementById('myNo').textContent = mine.no;
  document.getElementById('myName').textContent = mine.name;
  document.getElementById('mySongs').innerHTML =
    mine.songs.map(function (s, i) { return (i + 1) + '. ' + esc(s); }).join('<br>');
}
if (mine) showMine();

function submitSignup() {
  var name = document.getElementById('name').value.trim();
  var rows = [].map.call(songBox.children, function (r) {
    return { t: r.querySelector('.t').value.trim(), a: r.querySelector('.a').value.trim() };
  });
  // 只填一半的（有歌名沒歌手、或反過來）要擋下來，現場找歌會找不到
  var half = rows.filter(function (r) { return (r.t && !r.a) || (!r.t && r.a); });
  var songs = rows.filter(function (r) { return r.t && r.a; })
                  .map(function (r) { return r.t + ' - ' + r.a; });
  if (!name) { say(ERR.noname, 'bad'); return; }
  if (half.length) { say('歌名和歌手都要填，不然現場找不到歌。', 'bad'); return; }
  if (songs.length < MIN_SONGS) { say(ERR.fewsongs, 'bad'); return; }

  var btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = '送出中…';
  call({ action: 'signup', dev: dev, name: name, songs: songs.join('|') }, function (res) {
    btn.disabled = false; btn.textContent = '送出報名';
    if (!res || !res.ok) { say(errText(res && res.err), 'bad'); return; }
    mine = { no: res.no, name: res.name, songs: res.songs };
    writeJSON(MINE_KEY, mine);
    showMine();
    say('報名成功，你是 ' + res.no + ' 號。', 'ok');
    loadList(true);
  }, function (e) {
    btn.disabled = false; btn.textContent = '送出報名';
    say(errText(e), 'bad');
  });
}

/* ══════════ 名單 ══════════ */
var list = [];
/** 按鈕進入等待狀態，回傳一個「復原」函式。後端慢的時候一定要有，不然大家會狂按 */
function busy(btn, text) {
  if (!btn) return function () {};
  var was = btn.textContent, done = false;
  btn.disabled = true;
  btn.textContent = text;
  return function () {
    if (done) return;
    done = true;
    btn.disabled = false;
    btn.textContent = was;
  };
}

function loadList(force, btn) {
  if (list.length && !force) { renderPeople(); return; }
  var idle = busy(btn, '整理中…');
  call({ action: 'list' }, function (res) {
    idle();
    if (!res || !res.ok) { say(errText(res && res.err), 'bad'); return; }
    list = res.list || [];
    renderPeople();
    renderSignupList();
  }, function (e) { idle(); say(errText(e), 'bad'); });
}

function renderSignupList() {
  var box = document.getElementById('signupList');
  if (!list.length) { box.textContent = '還沒有人報名。'; return; }
  box.innerHTML = list.map(function (p) {
    return '<div style="padding:3px 0"><b style="color:var(--gold)">' + p.no + '</b>　'
      + esc(p.name) + '　<span style="color:var(--faint);font-size:13px">'
      + esc(p.songs.join('、')) + '</span></div>';
  }).join('');
}

var picked = null;
function renderPeople() {
  var box = document.getElementById('people');
  if (!list.length) {
    box.innerHTML = '<p class="hint" style="margin:0">還沒有人報名。</p>';
    return;
  }
  box.innerHTML = '';
  list.forEach(function (p) {
    var done = !!voted[p.no];
    var b = document.createElement('button');
    b.className = 'person' + (done ? ' done' : '');
    b.setAttribute('aria-pressed', String(picked === p.no));
    b.innerHTML = '<span class="no"><b>' + p.no + '</b><i>號選手</i></span>'
      + '<span class="who"><b>' + esc(p.name) + '</b><i>' + esc(p.songs.join('、')) + '</i></span>'
      + (done ? '<span class="got">已評 ' + sum(voted[p.no]) + '</span>' : '');
    b.onclick = function () { pick(p.no); };
    box.appendChild(b);
  });
}
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

/* ══════════ 評分 ══════════ */
var scores = {};
function critHTML() {
  return CRITERIA.map(function (c, i) {
    var btns = [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button" data-c="' + i + '" data-n="' + n + '" aria-pressed="false">' + n + '</button>';
    }).join('');
    return '<div class="crit"><h3>' + c + '</h3><p>' + (CRIT_HINT[c] || '') + '</p>'
      + '<div class="scale">' + btns + '</div></div>';
  }).join('');
}
document.getElementById('crits').innerHTML = critHTML();
document.getElementById('crits').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-c]');
  if (!b) return;
  var c = Number(b.dataset.c);
  scores[c] = Number(b.dataset.n);
  [].forEach.call(b.parentNode.children, function (x) {
    x.setAttribute('aria-pressed', String(x === b));
  });
  document.getElementById('sendVote').disabled = (Object.keys(scores).length < CRITERIA.length);
});

function pick(no) {
  var p = list.filter(function (x) { return x.no === no; })[0];
  if (!p) return;
  picked = no;
  renderPeople();
  var who = no + ' 號選手　' + p.name;
  if (voted[no]) {
    document.getElementById('voteForm').hidden = true;
    document.getElementById('voteDone').hidden = false;
    document.getElementById('rTarget').textContent = who;
    document.getElementById('recap').innerHTML =
      CRITERIA.map(function (c, i) {
        return '<div><span>' + c + '</span><b>' + voted[no][i] + '</b></div>';
      }).join('') + '<div><span>小計</span><b>' + sum(voted[no]) + '</b></div>';
  } else {
    document.getElementById('voteDone').hidden = true;
    document.getElementById('voteForm').hidden = false;
    document.getElementById('vTarget').textContent = who;
    scores = {};
    [].forEach.call(document.querySelectorAll('#crits button'), function (x) {
      x.setAttribute('aria-pressed', 'false');
    });
    document.getElementById('sendVote').disabled = true;
  }
  document.getElementById(voted[no] ? 'voteDone' : 'voteForm')
    .scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearPick() {
  picked = null;
  document.getElementById('voteForm').hidden = true;
  document.getElementById('voteDone').hidden = true;
  renderPeople();
}

function submitVote() {
  if (picked == null) return;
  var v = CRITERIA.map(function (_, i) { return scores[i]; });
  if (v.some(function (x) { return !x; })) { say(ERR.badscore, 'bad'); return; }

  var btn = document.getElementById('sendVote');
  btn.disabled = true; btn.textContent = '送出中…人多時要等一下';
  var params = { action: 'vote', dev: dev, no: picked };
  v.forEach(function (n, i) { params['s' + (i + 1)] = n; });

  call(params, function (res) {
    btn.disabled = false; btn.textContent = '送出評分';
    if (!res || !res.ok) { say(errText(res && res.err), 'bad'); return; }
    voted[res.no] = res.scores;
    writeJSON(VOTED_KEY, voted);
    say('第 ' + res.no + ' 位記錄好了，小計 ' + res.sum + ' 分。', 'ok');
    pick(res.no);
  }, function (e) {
    btn.disabled = false; btn.textContent = '送出評分';
    say(errText(e), 'bad');
  });
}

/* ══════════ 成績 ══════════ */
function loadRank(btn) {
  var box = document.getElementById('rank');
  var note = document.getElementById('rankNote');
  var idle = busy(btn, '查詢中…');
  box.textContent = '查詢中…';
  call({ action: 'rank' }, function (res) {
    idle();
    if (!res || !res.ok) { box.textContent = ''; say(errText(res && res.err), 'bad'); return; }
    if (!res.published) {
      box.innerHTML = '<p class="hint" style="margin:0">主持人還沒公佈成績。</p>';
      note.textContent = '已經有 ' + (res.voters || 0) + ' 支手機評過分。';
      return;
    }
    if (!res.rank || !res.rank.length) { box.textContent = '還沒有成績。'; note.textContent = ''; return; }
    box.innerHTML = '<div class="rank">' + res.rank.map(function (r, i) {
      return '<div class="row"><span class="pos">' + (i + 1) + '</span>'
        + '<span class="who"><b>' + esc(r.name) + '</b>'
        + '<i>' + r.votes + ' 人評分・總分 ' + r.total + '</i></span>'
        + '<span class="avg">' + r.avg.toFixed(2) + '</span></div>';
    }).join('') + '</div>';
    note.textContent = '平均分高的在前；同分時評分人數多的在前。';
  }, function (e) { idle(); box.textContent = ''; say(errText(e), 'bad'); });
}

/* ══════════ 啟動 ══════════ */
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
var start = (location.hash || '').slice(1);
go(['signup', 'vote', 'result'].indexOf(start) >= 0 ? start : (mine ? 'vote' : 'signup'));
</script>
